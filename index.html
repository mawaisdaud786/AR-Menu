<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Bite AR Menu Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

.header{
    text-align:center;
    padding:25px;
    background:#1c1c1c;
    border-bottom:2px solid gold;
}

.category{
    margin-top:40px;
    color:gold;
}

.card{
    background:#1c1c1c;
    border:none;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    transition:0.3s;
}
.card:hover{
    transform:scale(1.02);
}

.food-img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

model-viewer{
    width:100%;
    height:250px;
    background:#000;
    border-radius:10px;
}

.price{
    color:gold;
    font-weight:bold;
}

.btn-ar{
    background:gold;
    border:none;
    width:100%;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
<h2>🍔 Food Bite AR Menu</h2>
<p>Complete Restaurant Experience with AR View</p>
</div>

<div class="container py-3">

<!-- MENU DATA SYSTEM -->
<script>

const data = {

"🍔 Burgers":[
["Patty Burger",349],
["Afghani Burger",349],
["Mac Chicken",379],
["Zinger Burger",449],
["Patakha Zinger",479],
["Special Zinger",549],
["Pizza Burger",620],
["Jumbo Burger",699]
],

"🍕 Pizza":[
["Tikka Pizza",599],
["Fajita Pizza",599],
["BBQ Pizza",599],
["Margherita",499]
],

"🍗 Fried Chicken":[
["Crispy Fried Chicken",279],
["Chicken for Couple",1500],
["Chicken for Family",2549]
],

"🍟 Fries":[
["Plain Fries Regular",199],
["Loaded Fries",500],
["Pizza Fries",550]
],

"🌯 Wraps":[
["Crunchy Wrap",449],
["Garlic Mayo Wrap",449],
["Chipotle Wrap",449]
],

"🍝 Pasta":[
["Alfredo Pasta",800],
["Baked Pasta",600],
["Macaroni Pasta",449]
],

"🥤 Drinks":[
["Regular Drink",90],
["1 Ltr",160],
["Juice",70]
],

"🍨 Desserts":[
["Ice Cream Large",440],
["Brownie Ice Cream",450]
],

"🎁 Deals":[
["Deal AA",699],
["Deal BB",949],
["Deal DD",1349],
["Deal EE",2449]
]

};

// RENDER FUNCTION
for(let cat in data){

document.write(`<h3 class="category">${cat}</h3><div class="row">`);

data[cat].forEach(item=>{

document.write(`
<div class="col-md-4">
<div class="card">

<h5 style="color:gold; margin-bottom:20px;" >${item[0]}</h5>

<img class="food-img"
src="https://picsum.photos/seed/${encodeURIComponent(item[0])}/800/600"
alt="${item[0]}">
<p class="price">Rs ${item[1]}</p>

<model-viewer
src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
ar
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>

<button class="btn btn-ar mt-2">View in AR 📱</button>

</div>
</div>
`);
});

document.write(`</div>`);

}

</script>

</div>

</body>
</html>
