<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AR Food Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
}

.card{
    background:#1c1c1c;
    border:none;
    border-radius:15px;
    margin-bottom:20px;
}

.btn-ar{
    background:gold;
    font-weight:bold;
    border:none;
    width:100%;
}
model-viewer{
    width:100%;
    height:400px;
    background:#000;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="container py-4">
<h2 class="text-center text-warning">🍔 AR Restaurant Menu</h2>

<div class="row">

<!-- 1 -->
<div class="col-md-4">
<div class="card p-3">
<h5>Burger</h5>
<p>Juicy grilled burger</p>

<model-viewer 
    src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
    ar 
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate>
</model-viewer>

<button class="btn btn-ar mt-2">View in AR 📱</button>
</div>
</div>

<!-- 2 -->
<div class="col-md-4">
<div class="card p-3">
<h5>Pizza</h5>
<p>Cheesy loaded pizza</p>

<model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ar 
    camera-controls
    auto-rotate>
</model-viewer>

<button class="btn btn-ar mt-2">View in AR 📱</button>
</div>
</div>

<!-- 3 -->
<div class="col-md-4">
<div class="card p-3">
<h5>Ice Cream</h5>
<p>Cold dessert</p>

<model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Duck.glb"
    ar 
    camera-controls
    auto-rotate>
</model-viewer>

<button class="btn btn-ar mt-2">View in AR 📱</button>
</div>
</div>

</div>
</div>

</body>
</html>
