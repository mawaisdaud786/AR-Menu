<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Menu 3D Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
}

.menu-card{
    background:#1c1c1c;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    transition:0.3s;
}
.menu-card:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px gold;
}

.btn-ar{
    background:gold;
    border:none;
    width:100%;
    padding:8px;
    font-weight:bold;
}

#viewer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
    z-index:9999;
}

#scene{
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div class="container py-4">

<h2 class="text-warning text-center mb-4">🍔 Royal Bite Menu</h2>

<div class="row">

<div class="col-md-4">
<div class="menu-card">
<h4>Cheese Burger</h4>
<p>Juicy grilled burger with cheese</p>
<button class="btn btn-ar" onclick="open3D('burger')">View 3D</button>
</div>
</div>

<div class="col-md-4">
<div class="menu-card">
<h4>Pizza</h4>
<p>Loaded chicken pizza</p>
<button class="btn btn-ar" onclick="open3D('pizza')">View 3D</button>
</div>
</div>

<div class="col-md-4">
<div class="menu-card">
<h4>Ice Cream</h4>
<p>Cold creamy dessert</p>
<button class="btn btn-ar" onclick="open3D('icecream')">View 3D</button>
</div>
</div>

</div>
</div>

<!-- 3D VIEWER -->
<div id="viewer">
<button onclick="close3D()" class="btn btn-danger m-2">Close</button>
<div id="scene"></div>
</div>

<script>

let scene, camera, renderer, object;

function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("scene").innerHTML = "";
    document.getElementById("scene").appendChild(renderer.domElement);

    // LIGHTS (VERY IMPORTANT)
    const light1 = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 1);
    light2.position.set(5,5,5);
    scene.add(light2);

    camera.position.z = 5;
}

function loadFood(type){

    if(object){
        scene.remove(object);
    }

    const material = new THREE.MeshStandardMaterial({
        color: 0xffcc00,
        roughness: 0.4,
        metalness: 0.1
    });

    if(type === "burger"){
        const bun = new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.4,32), material);
        const patty = new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.3,32), new THREE.MeshStandardMaterial({color:0x3b2f2f}));
        patty.position.y = 0.4;

        const top = new THREE.Mesh(new THREE.SphereGeometry(1,32,32,0,Math.PI*2,0,Math.PI/2), material);
        top.position.y = 0.8;

        object = new THREE.Group();
        object.add(bun);
        object.add(patty);
        object.add(top);
    }

    if(type === "pizza"){
        object = new THREE.Mesh(
            new THREE.CylinderGeometry(1.5,1.5,0.2,32),
            new THREE.MeshStandardMaterial({color:0xffa500})
        );
    }

    if(type === "icecream"){
        object = new THREE.Mesh(
            new THREE.ConeGeometry(1,2,32),
            new THREE.MeshStandardMaterial({color:0xff69b4})
        );
    }

    scene.add(object);
}

function animate(){
    requestAnimationFrame(animate);

    if(object){
        object.rotation.y += 0.01;
    }

    renderer.render(scene, camera);
}

function open3D(type){
    document.getElementById("viewer").style.display="block";
    init();
    loadFood(type);
    animate();
}

function close3D(){
    document.getElementById("viewer").style.display="none";
}

window.addEventListener("resize",()=>{
    if(camera && renderer){
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
});

</script>

</body>
</html>
