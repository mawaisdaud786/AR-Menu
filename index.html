<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AR Menu Working</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
}

.card{
  margin:20px;
  padding:15px;
  background:#1c1c1c;
  border-radius:12px;
}

model-viewer{
  width:100%;
  height:350px;
  background:#000;
}
</style>
</head>

<body>

<h2 style="text-align:center;color:gold;">🍔 AR Restaurant Menu</h2>

<div class="card">
<h3>Burger</h3>

<model-viewer
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1">
</model-viewer>

</div>

<div class="card">
<h3>Pizza</h3>

<model-viewer
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate>
</model-viewer>

</div>

</body>
</html>
